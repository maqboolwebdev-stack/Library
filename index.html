<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <div class="header">
      <button class="add-btn"><span><img src="images/plus-solid-full.svg" alt=""></span>Add Book</button>
    </div>

    <dialog id="my-form">
      
        <input class="title" placeholder="Title" />
      <input class="author" placeholder="Author" />
      <input class="page" type="number" placeholder="Pages" />
      <label>
       Read:
        <input class="status" type="checkbox" />
      </label>
      <div class="btn-container">
        <button class="close-btn">Close</button>
        <button class="submit-btn">Submit</button>
      </div>

  </dialog>

    <div class="books-container"></div>

    <script src="script.js"></script>
  </body>
</html>
