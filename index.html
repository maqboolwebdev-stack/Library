<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <div class="header">
      <button class="add-btn"><span><img src="images/plus-solid-full.svg" alt=""></span>Add Book</button>
    </div>

    <dialog id="my-form">
      
      <form novalidate>
        <input class="title" placeholder="Title" required/>
        <span class="error-message" id="title-error"></span>
        <input class="author" placeholder="Author" required />
        <span class="error-message" id="author-error"></span>
        <input class="page" type="number" placeholder="Pages" required min="1" />
        <span class="error-message" id="page-error"></span>
        <label>
          Read:
          <input class="status" type="checkbox" />
        </label>
        <div class="btn-container">
          <button type="button" class="close-btn">Close</button>
          <button type="submit" class="submit-btn">Submit</button>
        </div>
        
      </form>
  </dialog>

    <div class="books-container"></div>

    <script type="module" src="script.js"></script>
  </body>
</html>
